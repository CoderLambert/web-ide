allowBuilds:
  esbuild: true
  lightningcss: true
  better-sqlite3: true
onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - better-sqlite3
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: 4.1.11
  vite-plus: 0.3.0
  "@vitest/browser-playwright": 4.1.11
  "@vitest/coverage-v8": 4.1.11
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
